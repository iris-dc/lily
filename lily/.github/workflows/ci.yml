name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, UI tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Lint
        run: ./scripts/ci.sh lint

      - name: Build for testing
        run: ./scripts/ci.sh build

      - name: Unit tests
        run: ./scripts/ci.sh unit

      - name: UI tests
        run: ./scripts/ci.sh ui

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/results/*.xcresult
            build/results/*.log
          retention-days: 7
          if-no-files-found: ignore
