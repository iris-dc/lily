name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs read the repository and upload artifacts, which the token's read scope covers.
permissions:
  contents: read

# The SwiftLint release the build job installs and ci.sh lint checks for, with the SHA-256 of that release's
# portable_swiftlint.zip; change both together.
env:
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One build, then the UI suite in parallel shards: run end to end on one macOS runner the suite outgrew the 45-minute
# job limit (lint, build, unit and 22 minutes of UI tests on a developer Mac, longer on a runner). The build job lints,
# builds for testing once, runs the unit tests and archives the simulator products; each UI job restores them and
# runs its shard through the .xctestrun without rebuilding (scripts/ci.sh ui-shard). Lint fails when a UI test class
# is in no shard or the matrix below misses a shard, so neither can slip past CI. The build job hands the Xcode it
# selected to the UI jobs as a job output (DEVELOPER_DIR), so every shard runs the products under the Xcode that
# built them.
jobs:
  build-and-unit:
    name: Lint, build for testing, unit tests
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      developer_dir: ${{ steps.xcode.outputs.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode 26
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "developer_dir=$XCODE/Contents/Developer" >> "$GITHUB_OUTPUT"

      # ci.sh lints --strict with opt_in_rules, so a release turning a rule on by default would fail the gate with no
      # code change (redundant_sendable in 0.58.0 did); the zip is checked against the SHA-256 recorded when the
      # version was pinned. GITHUB_PATH prepends, so the pinned copy wins over the image's Homebrew one.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$HOME/.swiftlint" && unzip -o -q /tmp/swiftlint.zip swiftlint -d "$HOME/.swiftlint"
          echo "$HOME/.swiftlint" >> "$GITHUB_PATH"

      - name: Lint, build for testing, unit tests
        run: ./scripts/ci.sh build-and-unit

      - name: Archive the build products for the UI shards
        run: ./scripts/ci.sh archive-products

      - name: Upload build products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-products
          path: build/products.tgz
          retention-days: 1
          compression-level: 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-build
          path: |
            build/results/*.xcresult
            build/results/*.log
          retention-days: 7
          if-no-files-found: ignore

  ui-tests:
    name: UI tests (${{ matrix.shard }})
    needs: build-and-unit
    runs-on: macos-26
    # A shard carries about 18 minutes of tests on the runner plus the setup; the margin is for a constrained runner.
    timeout-minutes: 60
    # xcodebuild and xcrun honour DEVELOPER_DIR without xcode-select, so a shard never runs products built under
    # another 26.x when runner images differ within one run.
    env:
      DEVELOPER_DIR: ${{ needs.build-and-unit.outputs.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        # 1..N are the iPhone shards of UI_SHARDS in scripts/ci.sh; ipad is LilyIPadTests on an iPad simulator.
        shard: [1, 2, 3, 4, ipad]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A missing one fails loudly rather than silently picking another Xcode.
      - name: Use the build job's Xcode
        run: |
          test -d "$DEVELOPER_DIR" || { echo "The build job's Xcode is not on this runner: $DEVELOPER_DIR" >&2; exit 1; }
          xcodebuild -version

      - name: Download build products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-products
          path: build

      - name: Restore the build products
        run: ./scripts/ci.sh restore-products

      - name: UI tests
        run: ./scripts/ci.sh ui-shard ${{ matrix.shard }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-ui-${{ matrix.shard }}
          path: |
            build/results/*.xcresult
            build/results/*.log
          retention-days: 7
          if-no-files-found: ignore
