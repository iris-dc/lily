name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, UI tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install SwiftLint
        run: brew install swiftlint

      # One stage, the same one agents run locally: lint, build for testing once, then run both test bundles
      # without rebuilding. Separate unit and ui steps each rebuilt the test bundles.
      - name: Lint, build for testing, unit and UI tests
        run: ./scripts/ci.sh all

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            build/results/*.xcresult
            build/results/*.log
          retention-days: 7
          if-no-files-found: ignore
