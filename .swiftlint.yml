# SwiftLint configuration for Lily. Run with `swiftlint` or `./scripts/ci.sh lint`.
included:
  - lily
  - lilyTests
  - lilyUITests
excluded:
  - build
  - lily.xcodeproj

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

disabled_rules:
  - todo # tracked in issues, not in code
  - trailing_comma # trailing commas are preferred in multi-line literals

line_length:
  warning: 130
  error: 160
  ignores_urls: true
  ignores_comments: true

function_body_length:
  warning: 40
  error: 60

type_body_length:
  warning: 200
  error: 300

file_length:
  warning: 300
  error: 400

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length: 2
  excluded: [id, a, b, x, y, t, km, lr, lg, lb, dr, dg, db]

nesting:
  type_level: 2

